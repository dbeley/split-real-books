[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
markers =
    unit: Unit tests for individual functions
    integration: Integration tests with filesystem and PDFs
    characterization: Characterization tests for existing behavior
    edge_case: Edge case and error handling tests
